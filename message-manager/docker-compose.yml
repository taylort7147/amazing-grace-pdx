services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:3001
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    restart: "unless-stopped"
    environment:
      - IDENTITY_DB_DIALECT=mssql
      - IDENTITY_DB_HOST=message-manager-mssql
      - IDENTITY_DB_PORT=1433
      - IDENTITY_DB_NAME=identity-db
      - IDENTITY_DB_USER=sa
      - IDENTITY_DB_PASSWORD=Password123
      - MESSAGE_DB_DIALECT=mssql
      - MESSAGE_DB_HOST=message-manager-mssql
      - MESSAGE_DB_PORT=1433
      - MESSAGE_DB_NAME=message-db
      - MESSAGE_DB_USER=sa
      - MESSAGE_DB_PASSWORD=Password123
      - NUCLEUS_DB_DIALECT=mssql
      - NUCLEUS_DB_HOST=message-manager-mssql
      - NUCLEUS_DB_PORT=1433
      - NUCLEUS_DB_NAME=nucleus-db
      - NUCLEUS_DB_USER=sa
      - NUCLEUS_DB_PASSWORD=Password123
    depends_on:
      - mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: message-manager-mssql
    environment:
      SA_PASSWORD: "Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P Password123 -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mssql_data:
